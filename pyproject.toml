[project]
name = "emporio-agent"
version = "0.1.0"
description = "Customer service agent for Empório da Música, a fictional music store."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "langchain>=1.4.7",
    "langchain-openai>=1.7.3",
    "langgraph>=1.2.19",
    "langgraph-checkpoint-sqlite>=3.1.3",
    "pandas>=2.2",
    "pypdf>=6.21.4",
    "python-dotenv>=1.2.4",
]

[project.scripts]
emporio-chat = "emporio_agent.cli:main"

[project.optional-dependencies]
# Mirrors the "dev" dependency group so `pip install -e ".[dev]"` works without uv.
dev = [
    "pytest>=8.0",
    "pyyaml>=6.0.3",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pyyaml>=6.0.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/emporio_agent"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
# langsmith (third party) uses asyncio.iscoroutinefunction, deprecated on Python 3.14.
filterwarnings = ["ignore:.*iscoroutinefunction.*:DeprecationWarning:langsmith"]
