[project]
name = "emporio-agent"
version = "0.1.0"
description = "Customer service agent for Empório da Música, a fictional music store."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
]

[project.optional-dependencies]
# Mirrors the "dev" dependency group so `pip install -e ".[dev]"` works without uv.
dev = [
    "pytest>=8.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/emporio_agent"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
